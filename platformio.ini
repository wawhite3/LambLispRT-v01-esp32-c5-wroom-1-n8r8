[platformio]
default_envs = esp32-c5-wroom-1-n8r8
boards_dir = ll_pio/boards
core_dir = ~/.platformio-idf55

; ============================================================================
; PLATFORM PIN -- DO NOT UNPIN, AND DO NOT BUMP WITHOUT RE-MEASURING MEMORY.
;   = Arduino core 3.3.11 = ESP-IDF 5.5.5   (published 2026-07-24)
; A bare `platform = espressif32` FLOATS to whatever happens to be installed, which
; is why this is pinned at all; the pin is a release URL, so it is also the only
; in-tree record of which core this project is built against.
;
; WHY NOT THE OFFICIAL PLATFORM: platform-espressif32 7.0.1 (PlatformIO's current
; official release) still pins framework-arduinoespressif32 ~3.20017.0 = Arduino
; 2.0.17 = ESP-IDF 4.4.7, which went EOL ~mid-2024.  The official platform never
; advanced the core past 2.0.17, so `framework = arduino` there IS a choice to stay
; on an EOL IDF.  pioarduino is the fork that tracks current Arduino/IDF while
; keeping `framework = arduino`.
;
; WHAT THIS MIGRATION IS FOR: IDF 4.4.7 has no esp_mmu_map(), no PSRAM MMU target,
; and its esp_ptr_executable() excludes the whole 0x3D000000 PSRAM window -- so NCG
; code could only ever live in the 32 KB D/IRAM pool.  IDF 5.x has esp_mmu_map() +
; MMU_MEM_CAP_EXEC + MMU_TARGET_PSRAM0 on the S3.  Whether PSRAM can actually back
; an EXECUTABLE mapping is STILL UNVERIFIED: the primitives exist, the capability
; has not been demonstrated.  Do NOT record it as working until a stub has been
; written into PSRAM and successfully called.
;
; RE-MEASURE BEFORE TRUSTING ANY MEMORY CONSTANT.  These were measured against the
; ESP-IDF 4.4.7 layout and are NOT valid here until re-taken:
;   - LL_NCG_EXEC_POOL_BYTES = 32 KB (ll_platform_generic.h), measured twice over
;     on the S3 and the LX6, not guessed;
;   - the B95 internal-DRAM cliff: at a 128 KB pool the N8R2 had 500 bytes of
;     INTERNAL DRAM free after setup, so every 512-byte LittleFS read returned
;     ESP_ERR_NO_MEM (err 257).
; THE SYMPTOM TO RECOGNISE: a layout change does NOT present as an allocation error
; -- it presents as MISSING TEST FILES, because the reads fail, not the allocations.
; ============================================================================
[common]
build_type = release
board_build.variants_dir = ll_pio/variants
board_build.variant = ll_variant-generic
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -Wformat
    -O3
    -DNDEBUG
    -DCONFIG_DISABLE_HAL_LOCKS
    -DETHERNET_SPI_SPEED=26000000
    -DETHERNET_MAX_SOCK_NUM=2
    -DETHERNET_LARGE_BUFFERS
    -DCONFIG_LWIP_IPV6=1
    -DCONFIG_LWIP_IPV6_AUTOCONFIG=1
    -DCONFIG_LWIP_IPV6_NUM_ADDRESSES=3

[env:esp32-c5-wroom-1-n8r8]
extends = common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = ll_board-esp32c5-n8r8
board_build.partitions = ll_pio/partitions/partitions_8M_ota.csv
board_build.filesystem = littlefs
board_build.app_partition_name = ota_0
board_upload.offset_address = 0x130000
build_flags =
    -DLL_BOARD_NAME='"esp32-c5-wroom-1-n8r8"'
    -Wformat
    -O3
    -DNDEBUG
    -DCONFIG_DISABLE_HAL_LOCKS
    -DETHERNET_SPI_SPEED=26000000
    -DETHERNET_MAX_SOCK_NUM=2
    -DETHERNET_LARGE_BUFFERS
    -DCONFIG_LWIP_IPV6=1
    -DCONFIG_LWIP_IPV6_AUTOCONFIG=1
    -DCONFIG_LWIP_IPV6_NUM_ADDRESSES=3
    -DLL_ESP_ARDUINO=1
    -DLL_LITTLEFS=1
    -DBOARD_HAS_PSRAM
    -DLL_WIFI=1
    -DLL_BIGNUM=1
    -DLL_RATIONAL=1
    -DLL_COMPLEX=1
    -DLL_PROFIBUS=1
    -DLL_COMMONIO=1
    -DLL_I2C=1
    -DLL_WIRE=1
    -DLL_SPI=1
    -DLL_ONEWIRE=1
    -DLL_WS2812=1
    -DLL_SONAR=1
    -DLL_LCD1602=1
    -DLL_MODBUS=1
    -DLL_ESP32=1
    -DLL_RISCV32=1
    -DLL_ESP32C5=1
    -DCONFIG_ESP_INT_WDT_TIMEOUT_MS=300
    ${sysenv.W3_EXTRA_FLAGS}
    -L$PROJECT_DIR
    -llamblisp

; TEST RIG, NOT A PRODUCT -- deliverable:false since 2026-09-13.  Ship esp32-c5-wroom-1-n8r8 (generic) instead; this env exists only so a flash and a result bind to ONE PHYSICAL BOARD by MAC.  || ESP32-C5-WROOM-1-N8R8 on an ESP32-C5-DevKitC-1 carrier (8 MB flash, 8 MB quad PSRAM -- MEASURED, not read off a part number; RISC-V RV32, 240 MHz) -- unit 00, the first C5, installed 2026-09-09, MAC 10:bd:a3:e0:7f:3c.  IDENTICAL build to its sibling esp32-c5-wroom-1-n8r8-01: the two envs exist ONLY so a flash and a result bind to ONE PHYSICAL BOARD.  Two C5 units arrived (2026-09-09 and 2026-09-11) and until the split both answered to the single env `esp32-c5-devkitc-1-n8r8`, where `usbmac.py --port-for` sorts bridges first and returns cand[0] -- so a benchmark could measure whichever unit enumerated first with nothing to show it.  That is the same trap the N8R2 pair hit; see esp32s3-n8r2-00.  || NAMED FOR THE MODULE, NOT THE CARRIER.  What determines flash and PSRAM is the WROOM-1 module, so the env is named for it; `devkitc-1` names only the board the module is soldered to.  || USES THE STOCK esp32-c5-devkitc1-n8r4 BOARD DEFINITION.  The predecessor env used a w3-local ll_board-esp32c5-n8r8.json justified by the claim that building as n8r4 'silently gives the runtime half the PSRAM the board actually carries'.  THAT CLAIM IS FALSE (B338, measured 2026-09-11): the two JSON files are identical in all 19 build-affecting fields and differ only in the display `name` and an extra -DARDUINO_ESP32C5_DEV.  NEITHER file sets a PSRAM size at all -- the IDF sizes PSRAM by probing it at boot -- so no board JSON can halve or double it.  Do not re-fork a board file on that reasoning.  || P173 PHASE 0 HAS RUN AND THE ANSWER IS YES (c898846, a43b6b8, 2026-09-12): this part EXECUTES BYTES IT WROTE AT RUNTIME, from PSRAM.  `LL_NCG_PSRAM_EXEC` needs only a part with PSRAM -- PMP entry 6 covers the MSPI window RWX INDEPENDENTLY of the IDRAM split -- and 7e28baf dropped the 1 MB pool cap entirely: all PSRAM is executable, on both architectures.  So a stock-platform build gets NATIVE CODEGEN here, not a bytecode fallback.  THIS PASSAGE PREVIOUSLY SAID THE OPPOSITE and was read as current on 2026-09-16, three days after it stopped being true: it opened "NCG NUMBERS ... ARE UNMEASURED until P173 Phase 0 runs" and predicted that CONFIG_ESP_SYSTEM_PMP_IDRAM_SPLIT=y would refuse execution "so compiles fall back to the bytecode interpreter".  That was an EXPECTATION written before the gate ran; the gate then contradicted it, and the B367 paragraph below records the correct outcome -- while this one sat above it, unmarked, and got quoted.  WHAT IS ACTUALLY GIVEN UP without the PMP override or the arena is the 32 KB ON-DIE tier, i.e. SPEED, not capability: [B382] measures the control loop at 6 us on-die against ~270 us executing from quad-SPI PSRAM at 80 MHz.  `LL_NCG_DIRAM_POOL` is still 0 for RISC-V; that is the on-die tier's absence, not native codegen's.  || DELIVERABLE since 2026-09-13 BY EXPLICIT DECISION.  It was deliverable:false before, as a per-UNIT env bound to one physical board by MAC.  The consequence that flag prevented is now LIVE AND INTENDED, not an oversight: a wildcard release_any/publish_any WILL create and FORCE-PUSH one public repo PER PHYSICAL BOARD (LambLispRT-v01-esp32-c5-wroom-1-n8r8-00 and -01), and -DLL_BOARD_NAME carries the unit suffix into the customer package, so the customer sees a board-unit name rather than a product name.  If one generic C5 product is wanted instead, add an unsuffixed env -- the way esp32s3-n8r2 relates to esp32s3-n8r2-00 -- which differs only in -DLL_BOARD_NAME.  || B367 RESOLVED IN THE BUILD 2026-09-13: this env NO LONGER sets the PMP override. chip_flags carried -DLL_C5_PMP_RWX=1, which empties esp_cpu_configure_region_protection() so the app never re-applies the PMP, leaving SRAM writable AND executable -- and src/w3_c5_pmp_rwx.c says in its own banner, verbatim, Do not ship enabled. It is removed, so a customer build keeps W^X. NCG SURVIVES THAT: the PSRAM exec tier (LL_NCG_PSRAM_POOL) is gated on LL_RISCV32 and BOARD_HAS_PSRAM only, never on the override, because PMP entry 6 covers the MSPI window RWX independently of the IDRAM split. What is given up is the 32 KB on-die tier, i.e. SPEED, not native codegen. DO NOT RE-ADD the flag to a deliverable env; put it on a non-deliverable experiment env if it is ever needed again. || PSRAM IS 8 MB, MEASURED 2026-09-11, NOT INFERRED.  This env was flashed and the board printed its own report: `PSRAM free: 7917236 / 8388608`, `Flash size: 8192K`; the sibling unit reports the identical total.  The env was briefly named `-n8r4-` earlier that day from the module part number, before anything had been measured, and was renamed once the boards said otherwise -- that is the only reason an n8r4 spelling appears in git history here.  || BOARD TYPE: ll_board-esp32c5-n8r8, a w3-local definition, because THE PLATFORM SHIPS NO N8R8 (only esp32-c5-devkitc-1, -n4, -n8r4, -n16r4) and N8R4 and N8R8 are different board types that must not share one.  Do NOT 'simplify' this to the stock esp32-c5-devkitc1-n8r4: it would build identical bytes today -- PSRAM size is not expressible in a board JSON, ESP-IDF probes it at boot (B338) -- but it would misname the part everywhere the board id is read or logged.  That swap was made and reverted on 2026-09-11; the fact that it builds is not an argument that it is right.  [NOT DELIVERABLE -- dev/debug build, not shipped]